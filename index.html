<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>คลังข้อสอบ ครูพัด</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f7f6;--card:#fff;--ink:#1f2933;--mute:#617080;--line:#d9e2e0;--main:#e91e78;--main-d:#c4155f;--chip:#eaf0fb;--navy:#0b1f4b}
@media (prefers-color-scheme:dark){:root{--bg:#121816;--card:#1c2522;--ink:#e8efec;--mute:#9bacaa;--line:#31403c;--main:#ff4d94;--main-d:#e63a82;--chip:#1d2a44;--navy:#8fb0ff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Sarabun',system-ui,sans-serif;font-size:18px;line-height:1.55}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 40px}
header{text-align:center;padding:18px 0 14px}
h1{font-size:1.7rem;margin:0 0 4px;color:var(--navy)}
.band{height:14px;background:#0b1f4b}
.logo{height:130px;display:block;margin:0 auto 6px}
.icons{display:flex;justify-content:center;align-items:center;gap:14px;flex-wrap:wrap;margin:10px 0 4px}
.icons img{height:46px;width:auto}
.no{color:var(--navy)}
header p{color:var(--mute);margin:0}
.grid{display:grid;gap:12px;margin-top:10px}
a.set{display:block;text-decoration:none;color:inherit;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:16px 18px}
a.set:hover{border-color:var(--main)}
.no{display:inline-block;background:var(--chip);color:var(--main);font-weight:700;font-size:.85rem;border-radius:99px;padding:2px 12px;margin-bottom:6px}
.t{font-weight:700;font-size:1.1rem;margin:0}
.s{color:var(--mute);margin:2px 0 8px;font-size:.95rem}
.go{color:var(--main);font-weight:700}
footer{text-align:center;color:var(--mute);font-size:.85rem;margin-top:24px}
</style>
</head>
